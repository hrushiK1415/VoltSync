spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/voltsync}
    username: ${SPRING_DATASOURCE_USERNAME:voltsync}
    password: ${SPRING_DATASOURCE_PASSWORD:voltsync}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
    show-sql: false
