server:
  port: 8080

spring:
  application:
    name: voltsync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:voltsync;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
    show-sql: false
  cache:
    type: caffeine
    cache-names:
      - plans
      - hubMetadata
      - chargerMetadata

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [traceId=%X{traceId:-}, planId=%X{planId:-}] - %msg%n"
