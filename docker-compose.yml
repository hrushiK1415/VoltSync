services:
  postgres:
    image: postgres:16-alpine
    container_name: voltsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltsync
      POSTGRES_USER: voltsync
      POSTGRES_PASSWORD: voltsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltsync -d voltsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltsync-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/voltsync
      SPRING_DATASOURCE_USERNAME: voltsync
      SPRING_DATASOURCE_PASSWORD: voltsync
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
